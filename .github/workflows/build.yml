name: build
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - name: probe (Quellcode fuer Entwicklung)
        if: ${{ hashFiles('probe.flag') != '' }}
        continue-on-error: true
        run: |
          ./gradlew genSources --no-configuration-cache
          mkdir -p /tmp/p/mc /tmp/p/fabric
          for SRC in $(find $HOME/.gradle $PWD/.gradle -name "*sources*.jar" -path "*minecraft*" 2>/dev/null); do
            echo "$SRC"; (cd /tmp/p/mc && unzip -q -o "$SRC" 'net/minecraft/*' 'com/mojang/*' || true)
          done
          for j in $(find ~/.gradle -name "fabric-*.jar" -path "*fabric-api*" ! -name "*sources*"); do
            for c in $(unzip -Z1 "$j" | grep -E '^net/fabricmc/fabric/api/.*\.class$' | grep -v '\$'); do
              echo "== $c" >> /tmp/p/fabric/api.txt
              javap -cp "$j" "${c%.class}" >> /tmp/p/fabric/api.txt 2>/dev/null || true
            done
          done
          cd /tmp/p && git init -q && git checkout -q -b probe-src && git add -A
          git -c user.name=ci -c user.email=ci@x commit -qm probe
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" probe-src
      - name: build
        run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: BotArmee-Mod
          path: build/libs/
      - name: jar branch
        run: |
          mkdir -p /tmp/j && cp build/libs/botarmee-*[0-9].jar /tmp/j/ && cd /tmp/j && git init -q && git checkout -q -b probe-jar && git add -A
          git -c user.name=ci -c user.email=ci@x commit -qm jar
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" probe-jar
      - name: client test (screenshots)
        if: ${{ hashFiles('test.flag') != '' }}
        continue-on-error: true
        timeout-minutes: 40
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 libegl-mesa0 mesa-vulkan-drivers > /dev/null
          export LIBGL_ALWAYS_SOFTWARE=1 SDL_VIDEODRIVER=x11 MESA_GL_VERSION_OVERRIDE=4.5
          (timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" ./gradlew runClientGameTest --no-configuration-cache 2>&1 || echo "TEST FAILED/TIMEOUT") | tee /tmp/test.log | grep --line-buffered -E "BOTARMEE|ERROR|Exception|FAIL|OpenGL|GL_|Backend" | head -200
          if [ -f preview.flag ]; then
            (BOTARMEE_PREVIEW_ONLY=1 timeout 900 xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" ./gradlew runClientGameTest --no-configuration-cache 2>&1 || echo "PREVIEW FAILED") | tee -a /tmp/test.log | grep --line-buffered -E "BOTARMEE-RESULT|FAIL" | head -20
          fi
          mkdir -p /tmp/s && cd /tmp/s && git init -q && git checkout -q -b probe-shots
          tail -400 /tmp/test.log > test-tail.log
          grep -E "BOTARMEE|Exception|ERROR|Caused by|at de\.botarmee" /tmp/test.log | head -300 > errors.log || true
          find $GITHUB_WORKSPACE -name "*.png" -path "*screenshots*" -exec cp {} /tmp/s/ \;
          cp $GITHUB_WORKSPACE/build/libs/botarmee-*[0-9].jar /tmp/s/ 2>/dev/null || true
          L=$(find $GITHUB_WORKSPACE/build -name latest.log | head -1); [ -n "$L" ] && cp "$L" /tmp/s/latest.log
          git add -A && git -c user.name=ci -c user.email=ci@x commit -qm shots
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" probe-shots
