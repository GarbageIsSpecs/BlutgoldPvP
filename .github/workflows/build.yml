name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - name: probe (Quellcode fuer Entwicklung)
        if: ${{ hashFiles('probe.flag') != '' }}
        continue-on-error: true
        run: |
          ./gradlew genSources --no-configuration-cache || true
          mkdir -p probe
          find ~/.gradle /home/runner/work -name "*sources*.jar" -path "*minecraft*" 2>/dev/null | tee probe/found.txt
          for j in $(cat probe/found.txt); do cp "$j" probe/ ; done
          find ~/.gradle -name "fabric-*.jar" -path "*net.fabricmc.fabric-api*" | head -200 | xargs -I{} cp {} probe/ 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: ${{ hashFiles('probe.flag') != '' }}
        with:
          name: probe
          path: probe/
      - name: build
        run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: BotArmee-Mod
          path: build/libs/
